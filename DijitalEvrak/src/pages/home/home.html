<app-generic pageTitle="Ana Sayfa" [breadcrumbs]="[]" />

<!-- Girişten sonra bir kez: kullanıcının kendi son girişleri (başarısız deneme varsa uyarı).
     Yönetici panelinde gösterilmez; yönetici tüm kayıtları Giriş Kayıtları sayfasından görür. -->
<app-recent-logins *ngIf="!roleService.has('Yönetici')" />

<app-admin-dashboard *ngIf="roleService.has('Yönetici')" />

<!-- Ön Kayıt rolü, Gelen Evrak sorumlusuyla aynı kontrol panelini görür. -->
<app-gelen-evrak-dashboard *ngIf="roleService.hasAny(['Gelen Evrak', 'Ön Kayıt'])" />

<app-on-kayit-dashboard *ngIf="roleService.has('Misyon')" />

<app-birim-dashboard *ngIf="roleService.has('Birim Evrak Sorumlusu')" />
