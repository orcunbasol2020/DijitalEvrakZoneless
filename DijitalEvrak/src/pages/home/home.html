<app-generic pageTitle="Ana Sayfa" [breadcrumbs]="[]" />

<!-- Tek panel gösterilir: açılışta öncelikli rolünki, diğerlerine başlıktaki okla geçilir; bkz. HomeDashboards. -->
@switch (dashboards.active()) {
  @case ('admin') { <app-admin-dashboard /> }
  <!-- Ön Kayıt rolü, Gelen Evrak sorumlusuyla aynı kontrol panelini görür. -->
  @case ('gelen-evrak') { <app-gelen-evrak-dashboard /> }
  @case ('on-kayit') { <app-on-kayit-dashboard /> }
  @case ('birim-yonetici') { <app-birim-yonetici-dashboard /> }
  @case ('birim') { <app-birim-dashboard /> }
}
