<div class="zt-row">

  <span class="zt-dot" [ngClass]="dotClass">
    <span class="material-symbols-outlined">{{ dotIcon }}</span>
  </span>

  <div class="zt-info">
    <div class="zt-name" [title]="item.fullName">{{ item.fullName }}</div>
    <div class="zt-date">
      <span class="material-symbols-outlined">schedule</span>
      {{ item.createdDate | date:'dd.MM.yyyy HH:mm' }}
      <span *ngIf="metaLine">· {{ metaLine }}</span>
    </div>
  </div>

  <span class="badge rounded-pill py-1 zt-status" [ngClass]="statusBadgeClass">
    {{ statusLabel }}
  </span>

  <span class="badge rounded-pill small zt-source"
    [ngClass]="source === 'Atlas'
      ? 'bg-primary-subtle text-primary border border-primary-subtle'
      : 'bg-info-subtle text-dark border border-info-subtle'">
    {{ sourceLabel }}
  </span>

</div>
