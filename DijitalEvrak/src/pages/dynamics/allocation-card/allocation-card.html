<div class="card mb-4" style="min-width: 220px; position: relative;">

  <div *ngIf="loading" 
       class="d-flex justify-content-center align-items-center position-absolute top-0 start-0 w-100 h-100"
       style="background: rgba(255,255,255,0.7); z-index: 10;">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>


         <div class="card-header d-flex align-items-center"
        [ngStyle]="{
       'background': 
         item.isActive ? 'linear-gradient(135deg, #b2f3fb, #8eddea)' :
         'linear-gradient(135deg, #ddecee, #c9dde1)'
     }">
    <h5 class="card-title mt-1">
  {{ item.isActive ? 'Aktif Zimmet' : 'Zimmet' }}
</h5>
  </div>

  <div class="card-body d-flex flex-column">

    <div class="activity-list mb-2">
      <div class="activity-content mt-1">
        <div class="activity-title ms-1">
          {{ item.fullName }}
        </div>
        <div class="activity-subtitle ms-1">
          {{ item.createdDate | date:'dd.MM.yyyy HH:mm' }}
        </div>
      </div>
    </div>

  <div class="mt-auto pt-2 d-flex justify-content-between align-items-center gap-2 border-top">
    <span class="badge rounded-pill py-1 px-2"
        [ngClass]="source === 'Atlas'
            ? 'bg-primary-subtle text-primary border border-primary-subtle'
            : 'bg-info-subtle text-dark border border-info-subtle'">
        {{ source === 'Atlas' ? 'Atlas' : 'Evrak Takip' }}
    </span>

    <div class="d-flex gap-2">
      <!-- Ön Kayıt ve Zimmetleme -->
      <ng-container *ngIf="item.isPreRegistered; else onlyAllocated">
        <span class="material-symbols-outlined fs-5 ms-1 text-dark"
              title="Ön Kayıt Yapıldı"
              style="cursor: pointer;">save</span>

        <span class="material-symbols-outlined fs-5 ms-1 text-dark"
              title="Zimmetleme Yapıldı"
              style="cursor: pointer;">contract_edit</span>
      </ng-container>

      <!-- Sadece Zimmetleme -->
      <ng-template #onlyAllocated>
        <span class="material-symbols-outlined fs-5 ms-1 text-dark"
              title="Zimmet Devri Yapıldı"
              style="cursor: pointer;">contract_edit</span>
      </ng-template>
      <span *ngIf="item.status === 3"
            class="material-symbols-outlined fs-5 ms-1 text-success"
            title="Teslim Edildi"
            style="cursor: pointer;">
          hand_package
      </span>
    </div>
</div>

  </div>
</div>
