<app-generic
  pageTitle="QR List"
  [breadcrumbs]="[{title: 'QR List', url: 'qrlist', icon:''}]">
</app-generic>

<div class="row">
  <div class="col-md-12 col-12">
    <div class="card">

      <div class="card-header d-flex justify-content-between align-items-center">
        <h4>QR List</h4>

        <div class="d-flex gap-2 flex-wrap">

<div class="qr-link-btn-container">
  <button 
    *ngFor="let count of counts"
    class="qr-link-btn"
    [class.selected]="count === selectedCount"
    (click)="updateDocuments(count)">
    {{count}}
  </button>
</div>

<button
  class="btn btn-gradient-print"
  (click)="printQrList()" title="Çıktı Al">
  <span class="material-symbols-outlined">print</span>
</button>

        </div>
      </div>

      <div class="card-body">

        <div class="qr-placeholder-grid">

          <div *ngFor="let doc of documents" class="qr-placeholder-item">
            <div class="qr-placeholder-box">QR</div>
            <div class="qr-placeholder-text">{{doc}}</div>
          </div>

        </div>

      </div>

<hr class="qr-footer-hr">

<div class="qr-footer-info small mb-3">
  Toplam: {{documents.length}}
</div>

    </div>
  </div>
</div>
