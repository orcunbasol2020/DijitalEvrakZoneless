<app-generic pageTitle="Roller"
  [breadcrumbs]="[{title: 'Roller', url: 'role', icon: ''}]">
</app-generic>
<div [class.show-filters]="showFilters">
  <flexi-grid
    [data]="data()"
    [loading]="loading()"
    language="tr"
    [showCaption]="true"
    captionTitle="Roller"
    [showExportExcelBtn]="true"
    exportExcelFileName="roller"
    commandColumnTitle="Güncelle"
    (onRefresh)="result.reload()">
    <ng-template flexiGridCaptionCommandTemplate>

      <!-- 🔥 Filtre Aç/Kapa butonu -->
      <flexi-button
        btnIcon="filter_alt"
        btnColor="light"
        title="Filtre Aç/Kapat"
        flexiTooltip
        (click)="showFilters = !showFilters">
      </flexi-button>
      <flexi-button
        (click)="openCreateModal()"
        btnIcon="add"
        btnColor="primary"
        title="Rol Ekle"
        flexiTooltip />
    </ng-template>
    <flexi-grid-column field="name" title="Ad" />
    <flexi-grid-column field="isActive" title="Aktif" textAlign="center"
      filterType="boolean" [booleanData]="['Aktif', 'Pasif']"
      width="30px">
      <ng-template flexiGridCellTemplate let-item>
        <div class="d-flex justify-content-center">
          <div class="form-check form-switch">
            <input
              (change)="toggleActive(item)"
              class="form-check-input"
              type="checkbox"
              role="switch"
              [id]="item.id"
              name="item.id"
              [(ngModel)]="item.isActive">
          </div>
        </div>
      </ng-template>
    </flexi-grid-column>
    <flexi-grid-column field="isDeleted" title="Silindi" textAlign="center"
      filterType="boolean" [booleanData]="['Silindi', 'Silinmedi']"
      width="30px">
      <ng-template flexiGridCellTemplate let-item>
        <div class="d-flex justify-content-center">
          <div class="form-check form-switch">
            <input
              class="form-check-input"
              type="checkbox"
              role="switch"
              [id]="item.id"
              name="item.id"
              [(ngModel)]="item.isDeleted">
          </div>
        </div>
      </ng-template>
    </flexi-grid-column>

    <ng-template flexiGridColumnCommandTemplate let-item>
      <flexi-button btnIcon="edit" title="Güncelle" btnColor="info"
        (click)="openEditModal(item)">
      </flexi-button>
    </ng-template>
  </flexi-grid>
</div>

<!-- Ekle / Düzenle Modal -->
@if (modalVisible()) {
  <div class="modal-overlay" (click)="closeModal()">
    <div class="modal-box" style="width: 420px;" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h5 class="d-flex align-items-center mb-0">
          <span class="material-symbols-outlined me-2 text-secondary">security</span>
          {{ editingId() ? 'Rolü Güncelle' : 'Yeni Rol Ekle' }}
        </h5>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Rol Adı</label>
          <input
            type="text"
            class="form-control"
            placeholder="Örn. Yönetici"
            [(ngModel)]="form.name" />
        </div>

        <div class="form-check form-switch">
          <input
            class="form-check-input"
            type="checkbox"
            role="switch"
            id="isActiveSwitch"
            [(ngModel)]="form.isActive">
          <label class="form-check-label" for="isActiveSwitch">Aktif</label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" [disabled]="saving()" (click)="closeModal()">İptal</button>
        <button class="btn btn-primary" [disabled]="saving()" (click)="save()">
          @if (saving()) {
            <span class="spinner-border spinner-border-sm me-1"></span>
          }
          Kaydet
        </button>
      </div>
    </div>
  </div>
}
