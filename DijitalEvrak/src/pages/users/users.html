<app-generic pageTitle="Kullanıcılar"
  [breadcrumbs]="[{title: 'Kullanıcılar', url: 'users', icon: ''}]">
</app-generic>
<div [class.show-filters]="showFilters">
  <flexi-grid
    [data]="data()"
    [loading]="loading()"
    language="tr"
    [showCaption]="true"
    captionTitle="Kullanıcı Listesi"
    [showExportExcelBtn]="true"
    exportExcelFileName="kullanicilar"
    [filterable]="true"
    (onRefresh)="result.reload()">
    <ng-template flexiGridCaptionCommandTemplate>
      <span class="doc-category-chip active me-2" style="cursor: default;">
        {{ activeCount() }} / {{ data().length }} Aktif
      </span>

      <!-- 🔥 Filtre Aç/Kapa butonu -->
      <flexi-button
        btnIcon="filter_alt"
        btnColor="light"
        title="Filtre Aç/Kapat"
        flexiTooltip
        (click)="showFilters = !showFilters">
      </flexi-button>

      <flexi-button
        routerLink="/users/create"
        btnIcon="add"
        btnColor="primary"
        title="Kullanıcı Ekle"
        flexiTooltip />
    </ng-template>

    <flexi-grid-column field="name" title="Kullanıcı" width="220px">
      <ng-template flexiGridCellTemplate let-item>
        <div class="d-flex flex-column">
          <span class="fw-semibold">{{ item.name }} {{ item.surname }}</span>
          <span class="text-muted small">{{ item.userName }}</span>
        </div>
      </ng-template>
    </flexi-grid-column>

    <flexi-grid-column title="Birimi" width="160px">
      <ng-template flexiGridCellTemplate let-item>
        @if (item.departmentName) {
          <span class="badge department-badge" [ngClass]="getDepartmentBadgeClass(item.departmentShortName)" [title]="item.departmentName">
            <span class="material-symbols-outlined align-middle" style="font-size:13px;">apartment</span>
            {{ item.departmentShortName || item.departmentName }}
          </span>
        } @else {
          <span class="text-muted small">-</span>
        }
      </ng-template>
    </flexi-grid-column>

    <flexi-grid-column field="isActive" title="Aktif" textAlign="center"
      filterType="boolean" [booleanData]="['Aktif', 'Pasif']" width="110px">
      <ng-template flexiGridCellTemplate let-item>
        <div class="d-flex align-items-center justify-content-center gap-2">
          <div class="form-check form-switch mb-0">
            <input
              class="form-check-input"
              type="checkbox"
              role="switch"
              [id]="item.id"
              name="item.id"
              [(ngModel)]="item.isActive">
          </div>
          <span class="badge" [ngClass]="item.isActive ? 'badge-soft-success' : 'badge-soft-secondary'">
            {{ item.isActive ? 'Aktif' : 'Pasif' }}
          </span>
        </div>
      </ng-template>
    </flexi-grid-column>
    <flexi-grid-column field="isDeleted" title="Silindi" textAlign="center"
      filterType="boolean" [booleanData]="['Silindi', 'Silinmedi']"
      width="110px">
      <ng-template flexiGridCellTemplate let-item>
        <div class="d-flex align-items-center justify-content-center gap-2">
          <div class="form-check form-switch mb-0">
            <input
              (change)="changeIsAdmin(item)"
              class="form-check-input"
              type="checkbox"
              role="switch"
              [id]="item.id"
              name="item.id"
              [(ngModel)]="item.isDeleted">
          </div>
          <span class="badge" [ngClass]="item.isDeleted ? 'badge-soft-danger' : 'badge-soft-success'">
            {{ item.isDeleted ? 'Silindi' : 'Aktif' }}
          </span>
        </div>
      </ng-template>
    </flexi-grid-column>

    <ng-template flexiGridColumnCommandTemplate let-item>
      <flexi-button
        [routerLink]="['/','users','edit',item.id]"
        btnIcon="edit"
        btnColor="info"
        title="Güncelle"
        flexiTooltip />

      <flexi-button
        (click)="delete(item.id)"
        btnIcon="delete"
        btnColor="warning"
        title="Sil"
        flexiTooltip />
    </ng-template>

  </flexi-grid>
</div>
