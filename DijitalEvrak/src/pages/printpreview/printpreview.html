<div class="overlay">
  <div class="modal">

    <div class="modal-header">
      <h3>Önizleme</h3>
      <button class="close-btn" (click)="close()">×</button>
    </div>

    <div class="modal-body">

      <iframe
        *ngIf="pdfBlobUrl"
        [src]="pdfBlobUrl"
        width="100%"
        height="100%"
        style="border:none">
      </iframe>

      <printqrlist *ngIf="!pdfBlobUrl && isQrList" [data]="data"></printqrlist>

      <print-petition *ngIf="!pdfBlobUrl && !isQrList" [data]="data"></print-petition>

    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="close()">Kapat</button>
      <button class="btn btn-success" (click)="printPdf()">Yazdır</button>
    </div>

  </div>
</div>
