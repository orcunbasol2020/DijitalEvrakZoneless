<div class="overlay">
  <div class="modal" [class.is-petition]="isPetition">
    <div class="modal-header">
      <h3>Önizleme</h3>
      <button class="close-btn" (click)="close()">×</button>
    </div>
    <div class="modal-body">
      <iframe
        *ngIf="pdfBlobUrl"
        [src]="pdfBlobUrl"
        width="100%"
        height="100%"
        style="border:none">
      </iframe>
      <printqrlist *ngIf="!pdfBlobUrl && isQrList" [data]="data"></printqrlist>
      <!-- Dilekçe: A4 sayfa ekranda küçültülerek gösterilir (bkz. .petition-scale);
           PDF üretimi sırasında ölçek geçici olarak kaldırılır. -->
      <div class="petition-scale" *ngIf="isPetition">
        <print-petition [data]="data"></print-petition>
      </div>
      <print-envelope-label
        *ngIf="!pdfBlobUrl && isLabel"
        [data]="data">
      </print-envelope-label>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="close()">Kapat</button>
      <button class="btn btn-success" (click)="printPdf()">Yazdır</button>
    </div>
  </div>
</div>
