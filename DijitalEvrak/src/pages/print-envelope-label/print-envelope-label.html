<div id="print-area">
  <app-envelope-label
    [envelopeNo]="data?.envelopeNo"
    [receiverName]="data?.receiverName || data?.targetDepartmentName || data?.externalInstitutionName"
    [receiverKind]="data?.targetDepartmentId ? 'department' : 'external'"
    [unitName]="data?.unitName"
    [address]="data?.address"
    [senderDepartment]="data?.departmentName"
    [documentCount]="data?.documentCount"
    [date]="data?.createdDate">
  </app-envelope-label>
</div>
