<app-generic pageTitle="Yükle" [breadcrumbs]="[
  {title: 'Taranmış Evraklar', url: 'scanlist', icon: ''},
  {title: 'Yükle', url: 'create', icon: 'upload_file'}
  ]">
</app-generic>

<div class="row">
    <div class="col-md-6 col-12">
        <div class="card">
            <div class="card-body">
                <div class="card-header">
                    <h4>Taranmış Evrak Yükle</h4>
                </div>
                <div class="card-body">
                    <form [formGroup]="uploadForm" (ngSubmit)="onSubmit()">
                        <div class="form-group">
                            <label for="docUpload">Evrak Seç</label>
                            <input id="docUpload" type="file" class="form-control mt-1"
                                (change)="onFileSelected($event)" />
                            <div *ngIf="selectedFileName" class="mt-2">
                                Seçilen dosya: {{ selectedFileName }}
                            </div>
                        </div>

                        <div class="form-group mt-4 d-flex justify-content-end">
                            <button type="submit" class="btn btn-primary" [disabled]="!selectedFile">
                                Sisteme Yükle
                            </button>
                        </div>
                    </form>

                </div>
                <div class="mt-3"></div>
            </div>
        </div>
    </div>
</div>
