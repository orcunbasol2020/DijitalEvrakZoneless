<app-generic pageTitle="Birimler"
  [breadcrumbs]="[{title: 'Birimler', url: 'birimler', icon: ''}]">
</app-generic>
<div [class.show-filters]="showFilters">
  <flexi-grid
    [data]="data()"
    [loading]="loading()"
    language="tr"
    [showCaption]="true"
    captionTitle="Birimler"
    [showExportExcelBtn]="true"
    exportExcelFileName="birimler"
    (onRefresh)="result.reload()">
    <ng-template flexiGridCaptionCommandTemplate>

      <!-- 🔥 Filtre Aç/Kapa butonu -->
      <flexi-button
        btnIcon="filter_alt"
        btnColor="light"
        title="Filtre Aç/Kapat"
        flexiTooltip
        (click)="showFilters = !showFilters">
      </flexi-button></ng-template>
    <flexi-grid-column field="shortName" title="Kısa Ad" width="40px" />
    <flexi-grid-column field="name" title="Ad" />
    <flexi-grid-column field="isDeleted" title="Silindi" textAlign="center"
      filterType="boolean" [booleanData]="['Silindi', 'Silinmedi']"
      width="60px">
      <ng-template flexiGridCellTemplate let-item>
        <div class="d-flex justify-content-center">
          <div class="form-check form-switch">
            <input
              class="form-check-input"
              type="checkbox"
              role="switch"
              [id]="item.id"
              name="item.id"
              [(ngModel)]="item.isDeleted">
          </div>
        </div>
      </ng-template>
    </flexi-grid-column>
    <!--  <flexi-grid-column title="Tarih" width="40px">
  <ng-template flexiGridCellTemplate let-item>
    {{ item.createdDate | date:'dd.MM.yyyy' }}
  </ng-template>
</flexi-grid-column>-->
  </flexi-grid></div>
