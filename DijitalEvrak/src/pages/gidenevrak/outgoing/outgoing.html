<app-generic pageTitle="Giden Evraklar"
  [breadcrumbs]="[{title: 'Giden Evraklar', url: 'gidenevrak/outgoing', icon: ''}]">
</app-generic>

<div class="outgoing-grid" [class.show-filters]="showFilters">
  <flexi-grid
    [data]="gridData()"
    [loading]="loading()"
    [showCaption]="true"
    captionTitle="Giden Evraklar"
    [showExportExcelBtn]="true"
    exportExcelFileName="TaranmisEvrakListesi"
    [filterable]="true"
    language="tr"
    trMinHeight="39px"
    (onRefresh)="loadDocuments()">

    <ng-template flexiGridCaptionCommandTemplate>

      <flexi-button
        btnIcon="filter_alt"
        btnColor="light"
        title="Filtre Aç/Kapat"
        flexiTooltip
        (click)="showFilters = !showFilters">
      </flexi-button>
      <flexi-button
        btnIcon="add_box"
        btnColor="dark"
        title="Giden Evrak Kaydı"
        flexiTooltip
        (click)="goToCreate()">
      </flexi-button>
    </ng-template>
    <flexi-grid-column field="qrCode" title="Belge No" />
    <flexi-grid-column field="documentTypeLabel" title="Türü" textAlign="left" width="100px"
      filterType="select" [filterData]="documentTypeFilterData()">
      <ng-template flexiGridCellTemplate let-item>
        {{ item.documentTypeLabel }}
      </ng-template>
    </flexi-grid-column>
    <flexi-grid-column field="documentDate" title="Tarihi" width="100px" filterType="date">
      <ng-template flexiGridCellTemplate let-item>
        {{ item.documentDate | date:'dd.MM.yyyy' }}
      </ng-template>
    </flexi-grid-column>
    <flexi-grid-column field="securityDegreeLabel" title="Giz. Der." textAlign="center" width="90px"
      filterType="select" [filterData]="securityDegreeFilterData()">
      <ng-template flexiGridCellTemplate let-item>
        <span class="degree-badge-circle {{ securityDegreeBadgeClassMap[item.securityDegree] || 'degree-tier-1' }}"
          [title]="securityDegreeMap[item.securityDegree] || '-'">
          <span class="material-symbols-outlined" style="font-size: 16px;">{{ securityDegreeIconMap[item.securityDegree] || 'help' }}</span>
        </span>
      </ng-template>
    </flexi-grid-column>
    <flexi-grid-column field="subject" title="Konu" textAlign="left" width="200px">
      <ng-template flexiGridCellTemplate let-item>
        {{ item.subject || '-' }}
      </ng-template>
    </flexi-grid-column>
    <flexi-grid-column field="urgencyDegreeLabel" title="İvedilik" textAlign="center" width="90px"
      filterType="select" [filterData]="urgencyDegreeFilterData()">
      <ng-template flexiGridCellTemplate let-item>
        <span class="degree-badge-circle {{ urgencyDegreeBadgeClassMap[item.urgencyDegree] || 'degree-tier-1' }}"
          [title]="urgencyDegreeMap[item.urgencyDegree] || '-'">
          {{ urgencyDegreeInitialMap[item.urgencyDegree] || '-' }}
        </span>
      </ng-template>
    </flexi-grid-column>
    <flexi-grid-column field="departmentName" title="Nereden" textAlign="left" width="150px"
      filterType="select" [filterData]="departmentFilterData()">
      <ng-template flexiGridCellTemplate let-item>
        {{ item.departmentName }}
      </ng-template>
    </flexi-grid-column>
    <flexi-grid-column field="externalInstitutionName" title="Nereye" textAlign="left" width="150px"
      filterType="select" [filterData]="externalInstitutionFilterData()">
      <ng-template flexiGridCellTemplate let-item>
        {{ item.externalInstitutionName }}
      </ng-template>
    </flexi-grid-column>
   <flexi-grid-column title="Takip" textAlign="center" width="81px" [filterable]="false" [sortable]="false">
      <ng-template flexiGridCellTemplate let-item>
        <flexi-button
          btnIcon="conversion_path"
          title="Süreçler"
          btnColor="info"
          (click)="goToProcess(item.id)">
        </flexi-button>
      </ng-template>
    </flexi-grid-column>
    <flexi-grid-column title="Zimmet" textAlign="center" width="96px" [visible]="!isBirimEvrakSorumlusu()" [filterable]="false" [sortable]="false">
      <ng-template flexiGridCellTemplate let-item>
        <flexi-button
          btnIcon="article_person"
          title="Zimmetleme"
          btnColor="light"
          (click)="goToZimmet(item.id)">
        </flexi-button>
      </ng-template>
    </flexi-grid-column>
    <flexi-grid-column title="" textAlign="center" width="80px" [filterable]="false" [sortable]="false">
      <ng-template flexiGridCellTemplate let-item>
        <flexi-button
          *ngIf="item.source === 1"
          btnIcon="expand_circle_right"
          title="Giden Evrakı Güncelle"
          btnColor="primary"
          (click)="goToEdit(item)">
        </flexi-button>
      </ng-template>
    </flexi-grid-column>
    <flexi-grid-column title="" textAlign="center" width="60px" [filterable]="false" [sortable]="false">
      <ng-template flexiGridCellTemplate let-item>
        <flexi-button
          btnIcon="delete"
          title="Taranmış Evrakı Sil"
          btnColor="warning"
          (click)="delete(item.id)">
        </flexi-button>
      </ng-template>
    </flexi-grid-column>
  </flexi-grid>
</div>
